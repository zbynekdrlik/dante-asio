name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Line coverage of the whole workspace may not drop: each OS has its own
  # floor (the Windows run also covers the driver, the mapping and the
  # device's Windows code). Raise a floor whenever coverage rises.
  coverage:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Measured 75.37 % (86a20d9).
          - os: ubuntu-24.04
            floor: 73
          # Measured 70.72 % (b0233cd, with the E2E).
          - os: windows-2025
            floor: 68
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --workspace --locked --summary-only --fail-under-lines ${{ matrix.floor }}

  # Mutants in the code changed since main, the portable decision code
  # (`.cargo/mutants.toml`): a surviving mutant fails the build. Bounded:
  # past 20 min the gate's setup is wrong, never its budget.
  mutation:
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.148
      - run: git diff origin/main...HEAD > pr.diff
      - run: cargo mutants --in-diff pr.diff --baseline=skip --jobs 2 -- --all-targets

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_version.py origin/${{ github.base_ref }}

  bundle:
    needs: [fmt, test]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p dante-asio -p asio-driver
      - name: Stage the bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item target/release/dante-asio.exe, target/release/dante_asio_driver.dll, scripts/install.ps1, scripts/uninstall.ps1 bundle/
          Get-FileHash bundle/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content bundle/SHA256SUMS
      # The bundle as the PC runs it: installed as a service, killed and brought
      # back by the SCM, removed (Windows PowerShell 5.1, as on the PC).
      - name: Install, run, crash and remove the service
        shell: powershell
        run: .\scripts\ci-service-test.ps1 -Bundle bundle -DeviceConfig config\test-dante-device.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dante-asio-${{ github.sha }}
          path: bundle/
          if-no-files-found: error

