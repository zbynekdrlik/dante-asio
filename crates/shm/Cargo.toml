[package]
name = "shm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The shared memory between the ASIO driver and its instance's device process: the layout and, on Windows, the mapping and the events"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }
